name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Doctests
        run: |
          python - <<'PY'
          import doctest, importlib, sys
          total = 0
          for name in ("queuelite", "queuelite.job", "queuelite.backoff",
                       "queuelite.schema", "queuelite.engine", "queuelite.cli",
                       "queuelite.worker"):
              result = doctest.testmod(importlib.import_module(name))
              print(name, result)
              total += result.attempted
              if result.failed:
                  sys.exit(1)
          assert total >= 15, total
          PY

      - name: Demo
        run: python examples/demo.py

      - name: CLI contract
        env:
          DB: ${{ runner.temp }}/jobs.db
        run: |
          set -euo pipefail
          rm -f "$DB" "$DB-wal" "$DB-shm"

          python -m queuelite --db "$DB" init

          python -m queuelite --db "$DB" add --payload '{"task":"x","n":2}' \
            --unique same --json | tee add.json
          python - <<'PY'
          import json
          data = json.load(open("add.json"))
          assert data["id"] == 1, data
          assert data["duplicate"] is False, data
          PY

          # duplicate enqueue reports the original job
          python -m queuelite --db "$DB" add --payload '{"task":"x","n":3}' \
            --unique same --json | tee dup.json
          python - <<'PY'
          import json
          data = json.load(open("dup.json"))
          assert data["duplicate"] is True, data
          assert data["id"] == 1, data
          PY

          # priority: the second job wins, and the claim is a real lease
          python -m queuelite --db "$DB" add --payload '{"n":9}' --priority 5
          python -m queuelite --db "$DB" take --worker w1 --json | tee take.json
          python - <<'PY'
          import json
          data = json.load(open("take.json"))
          job = data["jobs"][0]
          assert job["id"] == 2, job
          assert job["state"] == "running", job
          assert job["worker"] == "w1", job
          assert job["attempts"] == 1, job
          assert job["lease_expires_at"] > job["run_at"], job
          PY

          python -m queuelite --db "$DB" complete --id 2 --worker w1 \
            --result '{"ok":true}' --json | tee done.json
          python - <<'PY'
          import json
          data = json.load(open("done.json"))
          assert data["state"] == "done", data
          assert data["result"] == {"ok": True}, data
          assert data["worker"] is None, data
          PY

          # completing twice loses the lease
          set +e
          python -m queuelite --db "$DB" complete --id 2 --worker w1 2>lease.txt
          status=$?
          set -e
          test "$status" -eq 4
          grep -q "done" lease.txt

          # requeue only works on dead jobs
          set +e
          python -m queuelite --db "$DB" requeue --id 1 2>state.txt
          status=$?
          set -e
          test "$status" -eq 5
          grep -q "only dead jobs requeue" state.txt

          python -m queuelite --db "$DB" stats --json | tee stats.json
          python - <<'PY'
          import json
          data = json.load(open("stats.json"))
          assert data["counts"]["done"] == 1, data
          assert data["counts"]["pending"] == 1, data
          assert data["ready"] == 1, data
          PY

          python -m queuelite --db "$DB" purge --json | tee purge.json
          python - <<'PY'
          import json
          assert json.load(open("purge.json"))["deleted"] == 1
          PY

  package:
    name: build and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install wheel and run the console script
        run: |
          python -m pip install dist/*.whl
          cd "$(mktemp -d)"
          queuelite init
          queuelite add --payload '{"task":"x"}'
          queuelite stats
          queuelite work --handler queuelite.job:encode_payload
          queuelite list --state done
          python -c "import queuelite; print(queuelite.__version__)"
